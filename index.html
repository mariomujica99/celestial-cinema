<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Celestial Cinema</title>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.has('search') || params.has('genre')) {
          location.replace('browse.html' + location.search);
          return;
        }
        var legacyFilter = params.get('filter');
        if (legacyFilter) {
          var isShows = legacyFilter === 'shows';
          location.replace('browse.html?list=' + (isShows ? 'trending' : legacyFilter) + '&type=' + (isShows ? 'tv' : 'movie'));
        }
      })();
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7345cc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="shortcut icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CCMDb" />
    <link rel="manifest" href="images/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/topnav.css">
    <link rel="stylesheet" href="styles/media-grid.css">
    <link rel="stylesheet" href="styles/status-messages.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/side-menu.css">
    <link rel="stylesheet" href="styles/search-dropdown.css">
    <link rel="stylesheet" href="styles/skeleton.css">
    <link rel="stylesheet" href="styles/home-hero.css">
    <link rel="stylesheet" href="styles/videos.css">
    <link rel="stylesheet" href="styles/home-rails.css">
  </head>
  <body>
    <nav class="topnav">
      <a class="active" href="index.html">Celestial Cinema</a>

      <div class="topnav-links">
        <a class="topnav-link" href="all reviews/allReviews.html">Reviews</a>
        <a class="topnav-link" href="watchlist/watchlist.html">Watchlist</a>
      </div>

      <div class="search-container">
        <form class="search-form" role="search" id="search-form">
          <input class="search-input" type="search" id="search-query" name="q" placeholder="Search movies | shows | people" autocomplete="off">
        </form>
      </div>
    </nav>

    <section class="home-hero" id="home-hero" aria-label="Featured trailers">
      <div class="hero-layout">
        <div class="hero-main">
          <div class="hero-skeleton" id="hero-skeleton">
            <div class="skeleton-block hero-skeleton-stage"></div>
            <div class="hero-slide-info" aria-hidden="true">
              <div class="hero-poster-wrap">
                <div class="skeleton-block hero-skeleton-poster"></div>
              </div>
              <div class="hero-slide-text">
                <div class="skeleton-block hero-skeleton-title"></div>
                <div class="skeleton-block hero-skeleton-subtitle"></div>
                <div class="skeleton-block hero-skeleton-meta"></div>
              </div>
            </div>
          </div>

          <div class="hero-track" id="hero-track" hidden></div>

          <div class="hero-nav-layer" id="hero-nav-layer" hidden>
            <button class="hero-nav" id="hero-prev-btn" type="button" aria-label="Previous trailer">‹</button>
            <button class="hero-nav" id="hero-next-btn" type="button" aria-label="Next trailer">›</button>
          </div>
        </div>

        <aside class="hero-up-next" id="hero-up-next" aria-label="Up next" hidden>
          <p class="hero-up-next-title">Up next</p>
          <div class="hero-up-next-list" id="hero-up-next-list"></div>
        </aside>
      </div>
    </section>

    <div class="home-action-row">
      <a class="home-action-btn" href="all reviews/allReviews.html">Reviews</a>
      <a class="home-action-btn" href="watchlist/watchlist.html">Watchlist</a>
    </div>

    <main class="home-rails">
      <section class="home-rail" id="rail-theaters">
        <header class="home-rail-header">
          <a class="home-rail-title-link" href="browse.html?list=now-playing&amp;type=movie">
            <h2 class="home-rail-title">In theaters</h2>
            <span class="home-rail-chevron" aria-hidden="true"></span>
          </a>
          <p class="home-rail-subtitle">Now playing in the US</p>
        </header>
        <div class="home-rail-track"></div>
      </section>

      <section class="home-rail" id="rail-upcoming">
        <header class="home-rail-header home-rail-header--with-controls">
          <div class="home-rail-heading">
            <a class="home-rail-title-link" href="browse.html?list=upcoming&amp;type=movie">
              <h2 class="home-rail-title">Coming soon</h2>
              <span class="home-rail-chevron" aria-hidden="true"></span>
            </a>
          </div>
        </header>
        <div class="home-rail-track"></div>
      </section>

      <section class="home-rail" id="rail-trending-shows">
        <header class="home-rail-header">
          <a class="home-rail-title-link" href="browse.html?list=trending&amp;type=tv">
            <h2 class="home-rail-title">Trending shows</h2>
            <span class="home-rail-chevron" aria-hidden="true"></span>
          </a>
          <p class="home-rail-subtitle">Most watched this week</p>
        </header>
        <div class="home-rail-track"></div>
      </section>

      <section class="home-rail" id="rail-streaming">
        <header class="home-rail-header home-rail-header--with-controls">
          <div class="home-rail-heading">
            <a class="home-rail-title-link" href="browse.html?provider=8&amp;type=movie&amp;name=Netflix">
              <h2 class="home-rail-title">What's streaming</h2>
              <span class="home-rail-chevron" aria-hidden="true"></span>
            </a>
          </div>
        </header>
        <div class="home-rail-track"></div>
      </section>

      <section class="home-rail" id="rail-interests">
        <header class="home-rail-header home-rail-header--with-controls">
          <div class="home-rail-heading">
            <div class="home-rail-title-link">
              <h2 class="home-rail-title">Browse Genres</h2>
            </div>
          </div>
        </header>
        <div class="home-rail-track"></div>
      </section>

      <section class="home-rail" id="rail-top-rated">
        <header class="home-rail-header home-rail-header--with-controls">
          <div class="home-rail-heading">
            <a class="home-rail-title-link" href="browse.html?list=top-rated&amp;type=movie">
              <h2 class="home-rail-title">Top rated</h2>
              <span class="home-rail-chevron" aria-hidden="true"></span>
            </a>
          </div>
        </header>
        <div class="home-rail-track"></div>
      </section>
      
      <section class="home-rail" id="rail-box-office">
        <header class="home-rail-header">
          <a class="home-rail-title-link" href="browse.html?list=box-office&amp;type=movie">
            <h2 class="home-rail-title">Top box office</h2>
            <span class="home-rail-chevron" aria-hidden="true"></span>
          </a>
          <p class="home-rail-subtitle">Worldwide gross, last 90 days</p>
        </header>
        <div class="box-office-layout"></div>
      </section>

      <section class="home-rail" id="rail-popular-people">
        <header class="home-rail-header">
          <a class="home-rail-title-link" href="people/popularPeople.html">
            <h2 class="home-rail-title">Popular people</h2>
            <span class="home-rail-chevron" aria-hidden="true"></span>
          </a>
          <p class="home-rail-subtitle">Trending in film and TV</p>
        </header>
        <div class="home-rail-track"></div>
      </section>
    </main>


    
    <script src="general/sideMenu.js"></script>
    <script src="general/utils.js"></script>
    <script src="general/search.js"></script>
    <script src="general/videos.js"></script>
    <script src="general/watchlistButton.js"></script>
    <script src="general/skeleton.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
